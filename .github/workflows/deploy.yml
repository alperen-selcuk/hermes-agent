name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, hermes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        env:
          DEPLOY_DIR: /root/hermes-agent
        run: |
          sudo rm -f $DEPLOY_DIR/.env
          sudo cp $GITHUB_WORKSPACE/.env $DEPLOY_DIR/.env
          mkdir -p $DEPLOY_DIR/hermes
          sudo cp $GITHUB_WORKSPACE/hermes/config.yaml $DEPLOY_DIR/hermes/config.yaml
          sudo cp $GITHUB_WORKSPACE/hermes/.env $DEPLOY_DIR/hermes/.env
          sudo docker compose -f $DEPLOY_DIR/docker-compose.yml up -d --force-recreate
